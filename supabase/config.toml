# Billing 4.5 — obie funkcje weryfikują tożsamość samodzielnie:
# billing-stripe-sync wymaga roli platform_admin, billing-checkout zalogowanego
# użytkownika i ustala podmiot z service_providers, nigdy z ciała żądania.
[functions.billing-stripe-sync]
verify_jwt = false

[functions.billing-checkout]
verify_jwt = false

# Portal klienta Stripe (4.8) — ta sama zasada: tożsamość z tokenu, podmiot
# z service_providers.user_id. Bez tego dowolny zalogowany otworzyłby portal
# cudzej firmy i anulował cudzą subskrypcję.
[functions.billing-portal]
verify_jwt = false

# Zadanie cykliczne gwarancji ceny (4.20). Woła je pg_cron, który nie ma JWT —
# tożsamość potwierdza nagłówek x-cron-secret. Brak sekretu = 403 i zero
# działania: ta funkcja ZMIENIA CENĘ, więc domyślne przepuszczenie znaczyłoby,
# że dowolne żądanie rusza cudze pieniądze.
[functions.billing-price-guarantee]
verify_jwt = false

# Webhook operatora — tożsamość potwierdza PODPIS (HMAC z STRIPE_WEBHOOK_SECRET),
# nie JWT. Stripe nie wysyła nagłówka Authorization, więc verify_jwt musi być
# wyłączone; brak sekretu = 503 i zero przetwarzania.
[functions.billing-stripe-webhook]
verify_jwt = false
