# Phase A security baseline: gateway JWT jest tylko pierwszą warstwą. Każda
# funkcja musi dodatkowo egzekwować auth/tenant/rolę albo mieć jawny fail-closed
# guard. Publiczny klucz anon również jest JWT i nigdy nie zastępuje requireUser.
# Trzy wyjątki bez JWT mają niezależny sekret/HMAC i zostały statycznie sprawdzone.

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

# Lokalna/deklaratywna polityka Supabase Auth. Przed `config push` należy
# potwierdzić dokładne limity dla produkcji i stagingu; nie wolno ich luzować
# tylko po to, aby ukryć abuse. Istniejące hasła nadal mogą służyć do logowania,
# ale każde nowe lub zmieniane hasło musi spełnić tę politykę po stronie Auth.
[auth]
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.rate_limit]
email_sent = 2
sms_sent = 10
anonymous_users = 1
token_refresh = 120
sign_in_sign_ups = 10
token_verifications = 10
web3 = 1

