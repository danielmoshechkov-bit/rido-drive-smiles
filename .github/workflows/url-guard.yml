name: URL Guard

# Blokuje domeny deweloperskie (lovable.app / preview--) w linkach wychodzących do klientów.
on:
  push:
  pull_request:

jobs:
  check-public-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check-public-urls.mjs

      # Straznik tlumaczen. Przewraca sie na KAZDYM NOWYM kluczu, ktory
      # wyrenderowalby uzytkownikowi wlasna nazwe zamiast tekstu, oraz na
      # kluczu z pl.json brakujacym w innym jezyku. Dlug juz istniejacy
      # siedzi w scripts/i18n-baseline.json i jest przepuszczany.
      - run: node scripts/check-i18n.mjs

      # Odczyt strony rozliczen nie moze niczego zapisywac. Wejscie w
      # "Rozliczenia kierowcow" nadpisywalo settlements.actual_payout kwota
      # policzona w przegladarce, wiec kwoty zmienialy sie same przy kazdym
      # odswiezeniu — takze na rozliczeniach juz oplaconych.
      - run: node scripts/check-rozliczenia-zapis.mjs
