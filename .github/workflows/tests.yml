name: Testy i kontrola typów

# Powód istnienia tego workflow (13.08.2026):
#
# Repo miało siedem plików `*_test.ts` i NIC ich nie uruchamiało — działały tylko
# u kogoś lokalnie. W tym samym tygodniu trzy błędy webhooka Stripe wyszły
# dopiero na produkcji, a jeden z nich (funkcja wołana, ale bez definicji —
# wycięta przy edycji sąsiedniego bloku) zostałby złapany przez `deno check`
# w kilka sekund.
#
# Dlatego oba kroki, nie sam `test`: testy sprawdzają logikę, `check` sprawdza,
# czy kod w ogóle się trzyma kupy.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  edge:
    name: Edge functions (Deno)
    runs-on: ubuntu-latest
    env:
      # Repo ma `package.json` frontu (Vite). Bez tego Deno traktuje katalog jak
      # projekt Node'a, szuka `node_modules` i wywala się na `@types/node` przy
      # imporcie `node:test`. Edge functions nie mają z tym package.json nic
      # wspólnego — typy dla `node:` daje sam Deno.
      DENO_NO_PACKAGE_JSON: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Kontrola typów. Łapie literówki, wycięte definicje i rozjazdy sygnatur
      # między modułem współdzielonym a wywołaniem — czyli dokładnie tę klasę
      # błędów, która nas kosztowała.
      #
      # ZAKRES ZAWĘŻONY do modułu wspólnego i billingu. Sprawdzenie całego
      # katalogu wywala się na funkcjach z zależnościami `npm:` (np. `email-probe`
      # ciągnie `nodemailer`), które wymagają `node_modules` — a instalowanie ich
      # w CI tylko po to, żeby sprawdzić typy, kosztuje więcej, niż daje.
      # Rozszerzenie zakresu = osobne zadanie, po uporządkowaniu tych zależności.
      - name: Kontrola typów (billing + moduł wspólny)
        run: |
          deno check supabase/functions/_shared/stripeWebhook.ts \
                     supabase/functions/_shared/invoiceNumbering.ts \
                     supabase/functions/_shared/invoiceNumbering_test.ts \
                     supabase/functions/billing-invoice-issue/index.ts \
                     supabase/functions/_shared/stripeWebhook_test.ts \
                     supabase/functions/_shared/requireRole.ts \
                     supabase/functions/_shared/requireRole_test.ts \
                     supabase/functions/_shared/bladFunkcji_test.ts \
                     supabase/functions/_shared/bramkaKompletna_test.ts \
                     supabase/functions/_shared/payu.ts \
                     supabase/functions/_shared/payu_test.ts \
                     supabase/functions/_shared/subscriptionGate.ts \
                     supabase/functions/_shared/subscriptionGate_test.ts \
                     supabase/functions/_shared/statusyDostepu.ts \
                     supabase/functions/_shared/statusyDostepu_test.ts \
                     supabase/functions/_shared/requireRole.ts \
                     supabase/functions/_shared/requireRole_test.ts \
                     supabase/functions/billing-stripe-webhook/index.ts \
                     supabase/functions/billing-checkout/index.ts \
                     supabase/functions/billing-stripe-sync/index.ts \
                     supabase/functions/billing-admin-plans/index.ts \
                     supabase/functions/billing-admin-features/index.ts \
                     supabase/functions/payment-core/index.ts \
                     supabase/functions/billing-payu-order/index.ts \
                     supabase/functions/billing-payu-webhook/index.ts
      # Funkcje warsztatowe z bramką subskrypcji (G5). Wchodzą do CI, bo to one
      # omijają RLS kluczem service_role — rozjazd sygnatury bramki z ich
      # wywołaniem oznaczałby cichą dziurę w bramkowaniu, a nie błąd na ekranie.
      # Przy okazji wyszło, że żadna z nich nie przechodziła dotąd `deno check`:
      # `workshop-parts-api` miał dziewięć błędów typów, `workshop-send-sms` jeden.
      - name: Kontrola typów (bramka warsztatowa)
        run: |
          deno check supabase/functions/workshop-send-sms/index.ts \
                     supabase/functions/workshop-notify-employee/index.ts \
                     supabase/functions/workshop-parts-api/index.ts \
                     supabase/functions/workshop-tire-reminders/index.ts \
                     supabase/functions/workshop-invite-employee/index.ts \
                     supabase/functions/workshop-accept-employee-invitation/index.ts \
                     supabase/functions/workshop-approve-findings/index.ts \
                     supabase/functions/workshop-employee-submit-findings/index.ts

      # Funkcje domknięte po audycie verify_jwt (16.08). Wchodzą do CI, bo
      # rozjazd sygnatury `wymagajRoli` z ich wywołaniem oznaczałby ponowne
      # otwarcie funkcji, która kasuje konta albo nadaje role.
      - name: Kontrola typów (funkcje po audycie)
        run: |
          deno check supabase/functions/reset-driver-password/index.ts \
                     supabase/functions/create-fleet-account/index.ts \
                     supabase/functions/getrido-ai-execute/index.ts \
                     supabase/functions/drivers-search/index.ts

      # Testy jednostkowe. `--allow-read` jest konieczne: część istniejących
      # testów agenta głosowego czyta pliki źródłowe i sprawdza, czego w nich
      # NIE MA (np. że runtime nie zawiera identyfikatorów canary). To audyt
      # kodu, nie test logiki, ale łapie realne regresje — więc dajemy odczyt.
      #
      # Świadomie NIE dajemy sieci ani zapisu: test, który ich potrzebuje,
      # przestał być testem jednostkowym.
      - name: Testy
        run: deno test --allow-read supabase/functions/_shared/
